<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">Codex SSH architecture</title>
<desc id="desc">Codex uses OpenAI Secure MCP Tunnel. A client inside your local network polls outbound over HTTPS and forwards requests to SSH-MCP over stdio. OpenSSH reaches a Debian server or optional Proxmox host and its test guests.</desc>
